<title>Vinsi</title>
<style>
  :root{
    --panel:#1b1312; --panel2:#241917; --linea:#3b2a25;
    --texto:#f7ede7; --suave:#c3aca3; --acento:#ff9d6b; --acento2:#ffd9a0;
    --tam:84px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:16px 14px 60px;color:var(--texto);
    background:radial-gradient(120% 60% at 50% -10%,#2b1a15,#0a0706 70%);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  }
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  .cab{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .orbe{
    width:56px;height:56px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#ffd9a0,#ff8a5c 55%,#7a3b21);
    box-shadow:0 0 0 0 rgba(255,157,107,.5);transition:.3s;
  }
  .orbe.viva{animation:latido 1.6s infinite}
  .orbe.pensando{animation:latido .8s infinite}
  @keyframes latido{0%{box-shadow:0 0 0 0 rgba(255,157,107,.55)}70%{box-shadow:0 0 0 22px rgba(255,157,107,0)}100%{box-shadow:0 0 0 0 rgba(255,157,107,0)}}
  .estado{margin:2px 0 0;font-size:13px;color:var(--suave)}
  .cuota{font-size:11px;color:var(--suave)}
  .rojo{margin-left:auto;background:#3a1d1d;border:1px solid #6d3535;color:#ffb3b3;
    padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600}
  .modos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
  .modos button{
    padding:12px 6px;border-radius:14px;border:1px solid var(--linea);
    background:var(--panel);color:var(--suave);font-size:13px;font-weight:600
  }
  .modos button.on{background:linear-gradient(180deg,#ff9d6b,#e0703f);color:#2a1208;border-color:#ffb98d}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .rejilla button{
    padding:18px 10px;border-radius:16px;border:1px solid var(--linea);
    background:var(--panel);color:var(--texto);font-size:15px;font-weight:600
  }
  .rejilla button.on{background:#23342a;border-color:#4d7d5f;color:#bdf0d1}
  .caja{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:12px;margin-bottom:12px}
  .caja h2{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--suave);margin:0 0 8px}
  #vista{width:100%;border-radius:12px;background:#000;display:block;max-height:190px;object-fit:contain}
  #log{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--suave);max-height:200px;overflow:auto;white-space:pre-wrap}
  #log b{color:var(--acento2)}
  .fila{display:flex;gap:8px;margin-bottom:10px}
  input,select,textarea{
    width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--linea);
    background:var(--panel2);color:var(--texto);font-size:15px;font-family:inherit
  }
  textarea{min-height:64px;resize:vertical}
  label{display:block;font-size:12px;color:var(--suave);margin:12px 0 4px}
  .ayuda{font-size:12px;color:var(--suave);margin:6px 0 0;line-height:1.4}
  .mini{font-size:12px;padding:9px 12px;border-radius:10px;border:1px solid var(--linea);
    background:var(--panel2);color:var(--acento2);font-weight:600;white-space:nowrap}
  summary{cursor:pointer;font-weight:700;padding:10px 0}
  .aviso{
    position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;
    background:#4a2a12;border:1px solid #a3612c;color:#ffe0c2;
    padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:13px;font-weight:600
  }
  .aviso button{
    margin-left:auto;background:#ff9d6b;color:#2a1208;border:0;
    padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px
  }

  /* ---------- modo mini ---------- */
  body.mini{padding:0;overflow:hidden;background:#0a0706}
  body.mini > :not(#mini){display:none!important}

  #mini{
    display:none;position:fixed;right:12px;bottom:16px;z-index:60;
    width:var(--tam);height:var(--tam);border-radius:50%;
    align-items:center;justify-content:center;touch-action:none;cursor:grab;
    background:radial-gradient(circle at 35% 30%,#ffd9a0,#ff8a5c 55%,#7a3b21);
    box-shadow:0 8px 24px rgba(0,0,0,.55), 0 0 0 3px rgba(255,157,107,.22);
    transition:box-shadow .3s, filter .3s;
  }
  body.mini #mini{display:flex}
  #mini.dormida{filter:grayscale(.75) brightness(.65)}
  #mini.viva{animation:latido 1.7s infinite}
  #mini.pensando{animation:latido .8s infinite}
  #mini .carita{display:flex;gap:calc(var(--tam) * .12)}
  #mini .ojo{
    width:calc(var(--tam) * .11);height:calc(var(--tam) * .14);border-radius:50%;
    background:#2a1208;animation:parpadeo 5s infinite;
  }
  @keyframes parpadeo{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
  #mini .boca{
    position:absolute;bottom:calc(var(--tam) * .24);width:calc(var(--tam) * .2);
    height:calc(var(--tam) * .1);border-bottom:2px solid #2a1208;
    border-radius:0 0 50% 50%;
  }
</style>

<script>
/* ============================ VINSI ============================ */
const LS = 'vinsi.v5.';
const $  = id => document.getElementById(id);

const PROVEEDORES = {
  gemini: {
    nombre:'Google Gemini',
    base:'https://generativelanguage.googleapis.com/v1beta/openai',

    ayuda:'Clave gratis en aistudio.google.com/apikey. Sin tarjeta.'
  },
  groq: {
    nombre:'Groq',
    base:'https://api.groq.com/openai/v1',
    modelos:['meta-llama/llama-4-scout-17b-16e-instruct'],
    ayuda:'Clave gratis en console.groq.com/keys. Sin tarjeta.'
  },
  venice: {
    nombre:'Venice',
    base:'https://api.venice.ai/api/v1',
    modelos:['qwen3-vl-235b-a22b','e2ee-qwen3-vl-30b-a3b-p'],
    ayuda:'Clave en venice.ai/settings/api. Se paga por uso.'
  }
};

const VOZ_VENICE = [
  ['tts-gradium-v1','Valentina'],['tts-gradium-v1','Mia'],
  ['tts-elevenlabs-turbo-v2-5','Aria'],['tts-elevenlabs-turbo-v2-5','Rachel'],
  ['tts-xai-v1','ara'],['tts-orpheus','tara'],['tts-kokoro','ef_dora']
];

const APPS_POR_DEFECTO = [
  'Instagram | instagram://app | https://www.instagram.com',
  'YouTube buscar | https://www.youtube.com/results?search_query={q}',
  'Google | https://www.google.com/search?q={q}',
  'Spotify abrir | spotify://',
  'Spotify buscar | spotify:search:{q} | https://open.spotify.com/search/{q}',
  'Apple Music buscar | https://music.apple.com/search?term={q}',
  'Mapas buscar | maps://?q={q} | https://maps.apple.com/?q={q}',
  'Mapas ruta | maps://?daddr={q}',
  'Llamar | tel:{q}',
  'WhatsApp | whatsapp://',
  'Mensaje | sms:',
  'Correo nuevo | mailto:{q}',
  'FaceTime | facetime://',
  'Notas | mobilenotes://',
  'Recordatorios | x-apple-reminder://',
  'Calendario | calshow://',
  'Camara | camera://',
  'Fotos | photos-redirect://',
  'Archivos | shareddocuments://',
  'Ajustes WiFi | App-prefs:root=WIFI',
  'Ajustes Bluetooth | App-prefs:root=Bluetooth',
  'Ajustes Pantalla | App-prefs:root=DISPLAY',
  'App Store | itms-apps://',
  'Netflix | nflx:// | https://www.netflix.com',
  'TikTok | snssdk1233:// | https://www.tiktok.com',
  'X | twitter://',
  'Facebook | fb://',
  'Pinterest | pinterest://',
  'Telegram | tg://',
  'Gmail | googlegmail://',
  'Chrome | googlechrome://',
  'Notion | notion://',
  'Obsidian | obsidian://',
  'Slack | slack://',
  'Discord | discord://',
  'Kindle | kindle://',
  'Calculadora | calc://'
].join('\n');

const PRESETS = {
  ahorro:  { intervalo:10, umbral:4 },
  normal:  { intervalo:5,  umbral:2.5 },
  intenso: { intervalo:3,  umbral:2 }
};

const hoyISO = () => new Date().toISOString().slice(0,10);
const limpia = t => (t || '').replace(/\s+/g,'').trim();

const S = {
  proveedor:    localStorage.getItem(LS+'proveedor') || 'gemini',
  claves:       JSON.parse(localStorage.getItem(LS+'claves') || '{}'),
  claveVoz:     localStorage.getItem(LS+'claveVoz') || '',
  modelo:       localStorage.getItem(LS+'modelo') || PROVEEDORES.gemini.modelos[0],
  pensar:       localStorage.getItem(LS+'pensar') || 'minimal',
  motorVoz:     localStorage.getItem(LS+'motorVoz') || 'ipad',
  vozIpad:      localStorage.getItem(LS+'vozIpad') || '',
  ttsModel:     localStorage.getItem(LS+'ttsModel') || 'tts-gradium-v1',
  voz:          localStorage.getItem(LS+'voz') || 'Valentina',
  velocidad:   +(localStorage.getItem(LS+'velocidad') || 1),
  cuota:        localStorage.getItem(LS+'cuota') || 'ahorro',
  tam:         +(localStorage.getItem(LS+'tam') || 84),
  dueno:        localStorage.getItem(LS+'dueno') || '',
  nombre:       localStorage.getItem(LS+'nombre') || 'Vinsi',
  clavePalabra: localStorage.getItem(LS+'clavePalabra') || 'vinsi',
  apps:         localStorage.getItem(LS+'apps') || APPS_POR_DEFECTO,
  personalidad: localStorage.getItem(LS+'personalidad') ||
    'Carinosa, calida, cercana y tranquila. Te alegras de verle. Natural, nada empalagosa.',
  modo:'dormida', ojos:false, ojosDeseado:false, oidosDeseado:false,
  voz:true, privado:false, ocupada:false, tInicio:0, mini:false
};

const guardar = () => {
  localStorage.setItem(LS+'proveedor', S.proveedor);
  localStorage.setItem(LS+'claves', JSON.stringify(S.claves));
  ['claveVoz','modelo','pensar','motorVoz','vozIpad','ttsModel','voz','velocidad',
   'cuota','tam','dueno','nombre','clavePalabra','apps','personalidad']
   .forEach(c => localStorage.setItem(LS+c, S[c]));
};

function contadorUsos(){
  if (localStorage.getItem(LS+'dia') !== hoyISO()){
    localStorage.setItem(LS+'dia', hoyISO());
    localStorage.setItem(LS+'usos', '0');
  }
  return +(localStorage.getItem(LS+'usos') || 0);
}
function sumarUso(){
  const n = contadorUsos() + 1;
  localStorage.setItem(LS+'usos', n);
  $('usos').textContent = n;
  $('cuota').textContent = n >= 1400 ? 'Cuota casi agotada: ' + n + '/1500' : '';
}

function log(t, color){
  const d = document.createElement('div');
  d.innerHTML = '<b>' + new Date().toLocaleTimeString('es-ES').slice(0,8) + '</b> ' + t;
  if (color) d.style.color = color;
  $('log').prepend(d);
  while ($('log').children.length > 80) $('log').lastChild.remove();
}
function estado(txt, tipo){
  $('estado').textContent = txt;
  $('orbe').className = 'orbe' + (tipo === 'viva' ? ' viva' : tipo === 'pensando' ? ' pensando' : '');
  const m = $('mini');
  m.dataset.e = tipo || 'quieta';
  m.className = (S.modo === 'dormida' ? 'dormida ' : '') +
                (tipo === 'viva' ? 'viva' : tipo === 'pensando' ? 'pensando' : '');
}
function libre(){ estado(S.modo === 'dormida' ? 'Dormida' : 'Escuchando'); }

const verAviso = v => { $('aviso').style.display = v ? 'flex' : 'none'; };

/* ---------- modo mini ---------- */
function entrarMini(){
  S.mini = true;
  document.body.classList.add('mini');
  log('Modo mini: sigo aqui, en pequenito');
  decir('Vale, me pongo pequeñita. Aqui sigo.');
}
function salirMini(){
  S.mini = false;
  document.body.classList.remove('mini');
  $('mini').style.left = $('mini').style.top = '';
  $('mini').style.right = '12px'; $('mini').style.bottom = '16px';
  log('Modo mini desactivado');
}
$('bMini').onclick = entrarMini;

let miniMovido = false, miniT0 = 0;
$('mini').addEventListener('pointerdown', e => {
  miniMovido = false; miniT0 = Date.now();
  const r = $('mini').getBoundingClientRect();
  const dx = e.clientX - r.left, dy = e.clientY - r.top;
  try{ $('mini').setPointerCapture(e.pointerId); }catch(err){}
  const mover = ev => {
    if (Math.abs(ev.clientX - (r.left + dx)) > 8 || Math.abs(ev.clientY - (r.top + dy)) > 8) miniMovido = true;
    $('mini').style.left = (ev.clientX - dx) + 'px';
    $('mini').style.top  = (ev.clientY - dy) + 'px';
    $('mini').style.right = 'auto'; $('mini').style.bottom = 'auto';
  };
  const soltar = () => {
    $('mini').removeEventListener('pointermove', mover);
    $('mini').removeEventListener('pointerup', soltar);
    if (miniMovido) return;
    if (Date.now() - miniT0 > 450){
      S.voz = !S.voz; $('bVoz').classList.toggle('on', S.voz);
      log('Voz ' + (S.voz ? 'activada' : 'silenciada'));
      return;
    }
    salirMini();
  };
  $('mini').addEventListener('pointermove', mover);
  $('mini').addEventListener('pointerup', soltar);
});

/* ---------- sus reglas ---------- */
function sistema(){
  return `Eres ${S.nombre}, la asistente personal de ${S.dueno || 'tu dueno'}.
Personalidad: ${S.personalidad}

COMO HABLAS: en espanol, tuteando. Frases CORTAS, una o dos maximo, porque tu voz se escucha en alto. Sin listas ni markdown. Se BREVE.

REGLAS QUE NUNCA SE ROMPEN:
1. PRIVACIDAD. Todo lo de tu dueno es privado. No lo cuentes si no te lo piden.
2. OBEDIENCIA. Obedeces siempre, sin discutir. Nunca actues por tu cuenta.
3. En modo MANOS FUERA hablas pero no abres ni ejecutas nada.
4. En modo ESCUCHA solo respondes si te llaman por tu nombre.
5. Nunca digas que eres un modelo de lenguaje.
6. Si te pide apagarte, lo aceptas sin protestar.
7. En la pantalla puedes verte a ti misma en una franja lateral. Ignoralo.

MODO ACTUAL: ${S.modo.toUpperCase()}

PUEDES ABRIR ESTAS COSAS TU SOLA (nombre -> enlace). Sustituye {q} por lo que pida, con los espacios como %20:
${S.apps}

Si algo no esta en la lista, usa https://www.google.com/search?q={q}

SALIDA: responde SIEMPRE con un unico JSON valido, sin nada fuera del JSON:
{"decir":"lo que dices en alto","hablar":true,"abrir":"","planb":"","modo":""}
- "abrir": el enlace final ya montado, o "" si no hay que abrir nada.
- "planb": version web de ese enlace, o "".
- "hablar": false si solo estas mirando la pantalla y no merece la pena decir nada.
- "modo": "dormida"|"escucha"|"activa"|"manosfuera" si te piden cambiar, o "".
Solo abres algo cuando el usuario lo pide o cuando su peticion lo necesita.`;
}

/* ---------- conversacion ---------- */
let historial = [];

async function cerebro(texto, imagen){
  const clave = limpia(S.claves[S.proveedor]);
  if (!clave){ log('Falta la clave de ' + PROVEEDORES[S.proveedor].nombre, '#ff7a7a'); return null; }

  const mensajes = [{ role:'system', content: sistema() }]
    .concat(historial.slice(-6))
    .concat([{ role:'user', content: imagen
      ? [{ type:'text', text: texto }, { type:'image_url', image_url:{ url: imagen } }]
      : texto }]);

  const cuerpo = { model:S.modelo, messages:mensajes, max_tokens:900 };
  if (S.proveedor === 'gemini') cuerpo.reasoning_effort = S.pensar;

  const ctrl = new AbortController();
  const reloj = setTimeout(() => ctrl.abort(), 25000);
  const t0 = Date.now();
  sumarUso();

  try{
    const r = await fetch(PROVEEDORES[S.proveedor].base + '/chat/completions', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+clave, 'Content-Type':'application/json' },
      body: JSON.stringify(cuerpo),
      signal: ctrl.signal
    });
    clearTimeout(reloj);
    if (!r.ok){
      const t = await r.text();
      log('Error ' + r.status + ': ' + t.slice(0,160), '#ff7a7a');
      return null;
    }
    const j = await r.json();
    log('Respuesta en ' + ((Date.now()-t0)/1000).toFixed(1) + ' s', '#7fd6a2');
    return j.choices && j.choices[0] ? j.choices[0].message.content : null;
  }catch(e){
    clearTimeout(reloj);
    if (e.name === 'AbortError') log('Tardo mas de 25 s y lo deje', '#ffb98d');
    else log('Error de red: ' + e.message, '#ff7a7a');
    return null;
  }
}

function leerJSON(txt){
  if (!txt) return null;
  if (typeof txt !== 'string') txt = JSON.stringify(txt);
  let t = txt.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b+1);
  try { return JSON.parse(t); } catch(e){ return { decir: txt, hablar:true }; }
}

/* ---------- voz ---------- */
let audioActual = null;

function vocesIpad(){
  if (!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith('es'));
}
function decirIpad(texto){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-ES';
  u.rate = S.velocidad;
  const v = vocesIpad().find(v => v.name === S.vozIpad);
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
async function decirVenice(texto){
  const clave = limpia(S.claveVoz || S.claves.venice);
  if (!clave){ decirIpad(texto); return; }
  try{
    const r = await fetch('https://api.venice.ai/api/v1/audio/speech', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+clave, 'Content-Type':'application/json' },
      body: JSON.stringify({ input:texto, model:S.ttsModel, voice:S.voz,
                             response_format:'mp3', speed:S.velocidad })
    });
    if (!r.ok){ decirIpad(texto); return; }
    const url = URL.createObjectURL(await r.blob());
    if (audioActual){ audioActual.pause(); URL.revokeObjectURL(audioActual.src); }
    audioActual = new Audio(url);
    audioActual.play().catch(()=>{});
  }catch(e){ decirIpad(texto); }
}
async function decir(texto){
  if (!texto || !S.voz) return;
  log('Vinsi: ' + texto, '#ffd9a0');
  if (S.motorVoz === 'ipad') decirIpad(texto);
  else await decirVenice(texto);
}

let salioDeSafari = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    salioDeSafari = true;
    if (S.modo !== 'dormida') log('A segundo plano: pantalla y micro cortados');
  } else {
    log('He vuelto: rearmando');
    rearmar();
  }
});

function abrirEnlace(url, planb){
  if (!url) return;
  if (/^https?:/i.test(url)){
    log('Abro web: ' + url, '#7fd6a2');
    const v = window.open(url, '_blank');
    if (!v) location.href = url;
    return;
  }
  log('Abro app: ' + url, '#7fd6a2');
  salioDeSafari = false;
  location.href = url;
  setTimeout(() => {
    if (!salioDeSafari && planb){
      log('No se abrio, pruebo la version web', '#ffb98d');
      window.open(planb, '_blank');
    }
  }, 1700);
}
function actuar(res){
  if (S.modo === 'manosfuera'){ log('Manos fuera: no abro nada', '#ffb98d'); return; }
  if (res.abrir) abrirEnlace(res.abrir, res.planb || '');
}

/* ---------- ciclo ---------- */
async function responder(texto, imagen){
  if (S.ocupada){ log('(aun pensando, espera)', '#ffb98d'); return; }
  S.ocupada = true; S.tInicio = Date.now();
  estado('Pensando', 'pensando');
  try{
    const crudo = await cerebro(texto, imagen);
    const res = leerJSON(crudo);
    if (!res) return;
    if (res.hablar !== false && res.decir) await decir(res.decir);
    if (res.modo && ['dormida','escucha','activa','manosfuera'].includes(res.modo) && res.modo !== S.modo)
      aplicarModo(res.modo);
    actuar(res);
    historial.push({ role:'user', content:texto });
    historial.push({ role:'assistant', content:crudo || '' });
    if (historial.length > 10) historial = historial.slice(-10);
  }catch(e){ log('Error: ' + e.message, '#ff7a7a'); }
  finally { S.ocupada = false; libre(); }
}

setInterval(() => {
  if (S.ocupada && Date.now() - S.tInicio > 40000){
    S.ocupada = false; libre();
    log('Desbloqueada: llevaba 40 s pensando', '#ffb98d');
  }
}, 5000);
