<style>
  :root{--ambar:#ffb27a;--rosa:#ff8fb0;--fondo:#07050c;--cristal:rgba(24,16,32,.86);
    --linea:rgba(255,190,150,.20);--texto:#f6ece4;--tenue:#b9a6b6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--fondo);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  #escena{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(120% 85% at 50% 82%,#2a1a30 0%,#140d1c 45%,#07050c 100%)}
  #cono{position:absolute;left:50%;bottom:-8%;width:118vw;height:104vh;transform:translateX(-50%);
    background:radial-gradient(60% 70% at 50% 100%,rgba(255,170,120,.22),rgba(255,120,170,.08) 55%,transparent 78%);
    filter:blur(18px);pointer-events:none;opacity:calc(.5 + var(--voz,0)*.9)}
  #lineas{position:absolute;inset:0;pointer-events:none;opacity:.22;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.09) 0 1px,transparent 1px 4px);
    animation:barrido 7s linear infinite;mix-blend-mode:screen}
  @keyframes barrido{from{background-position:0 0}to{background-position:0 40px}}
  #vineta{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 22vw rgba(5,3,10,.9);
    background:radial-gradient(85% 70% at 50% 55%,transparent 45%,rgba(5,3,10,.5) 100%)}
  canvas#lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;
    filter:drop-shadow(0 0 40px rgba(255,150,110,.35)) saturate(1.1) contrast(1.05)}
  #foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;
    opacity:0;transition:opacity .6s;animation:respirarF 5.5s ease-in-out infinite}
  #foto.on{opacity:1}
  @keyframes respirarF{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
  .flot{position:fixed;z-index:30;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:rgba(28,18,36,.62);border:1px solid var(--linea);color:var(--texto);
    border-radius:999px;transition:transform .18s,background .18s,opacity .3s}
  .flot:active{transform:scale(.92)}
  #engranaje{top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);
    width:46px;height:46px;font-size:21px;opacity:.72}
  #engranaje.abierto{opacity:1;background:rgba(255,178,122,.22);border-color:rgba(255,178,122,.5)}
  #parar{left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 12px);
    width:auto;padding:0 16px;height:42px;font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.7}
  #parar.on{background:rgba(255,90,110,.85);border-color:rgba(255,120,140,.9);opacity:1;color:#fff}
  #pildora{position:fixed;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + 62px);
    z-index:30;display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
    background:rgba(20,12,28,.55);border:1px solid var(--linea);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);font-size:11.5px;color:var(--tenue);letter-spacing:.05em}
  #punto{width:8px;height:8px;border-radius:50%;background:#8a7c8e;flex:0 0 auto;transition:background .3s}
  #punto.viva{background:#7ee0a5;box-shadow:0 0 10px #7ee0a5}
  #punto.piensa{background:#ffc46b;box-shadow:0 0 10px #ffc46b;animation:parp .8s infinite alternate}
  #punto.duerme{background:#6d5f74}
  @keyframes parp{to{opacity:.25}}
  #panel{position:fixed;top:0;right:0;z-index:50;width:min(430px,93vw);height:100%;
    background:var(--cristal);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    border-left:1px solid var(--linea);transform:translateX(103%);transition:transform .34s cubic-bezier(.3,.9,.3,1);
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 40px)}
  #panel.abierto{transform:translateX(0)}
  #panel::-webkit-scrollbar{width:0}
  #cab{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 0 12px;
    background:linear-gradient(rgba(24,16,32,.98),rgba(24,16,32,.9) 70%,transparent)}
  #cab h1{margin:0;font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ambar)}
  #cerrar{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:transparent;
    color:var(--texto);font-size:17px;display:flex;align-items:center;justify-content:center}
  h2{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ambar);
    margin:22px 0 10px;font-weight:700;opacity:.9}
  p.ayuda{font-size:11.5px;color:var(--tenue);line-height:1.5;margin:6px 0 0}
  label{display:block;font-size:12px;color:var(--tenue);margin:12px 0 5px}
  input[type=text],input[type=password],input:not([type]),select,textarea{width:100%;padding:11px 12px;
    border-radius:11px;border:1px solid var(--linea);background:rgba(0,0,0,.32);color:var(--texto);
    font-size:15px;font-family:inherit;-webkit-user-select:text;user-select:text;outline:none}
  input:focus,select:focus,textarea:focus{border-color:rgba(255,178,122,.6)}
  textarea{resize:vertical;min-height:100px;line-height:1.45}
  input[type=range]{width:100%;accent-color:var(--ambar);padding:0;background:transparent;border:0}
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rejilla3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .op{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;
    border-radius:12px;border:1px solid var(--linea);background:rgba(0,0,0,.26);font-size:13.5px;margin-bottom:8px}
  .op span{flex:1;line-height:1.3}
  .op small{display:block;font-size:10.5px;color:var(--tenue);margin-top:2px}
  .inter{border:0;padding:0;width:46px;height:27px;border-radius:999px;background:rgba(255,255,255,.14);
    position:relative;flex:0 0 auto;transition:background .2s}
  .inter::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
    background:#fff;transition:transform .2s}
  .inter.on{background:linear-gradient(90deg,var(--ambar),var(--rosa))}
  .inter.on::after{transform:translateX(19px)}
  button.b{width:100%;padding:13px;border-radius:12px;border:1px solid var(--linea);background:rgba(0,0,0,.26);
    color:var(--texto);font-size:13.5px;font-family:inherit;transition:background .15s,transform .12s}
  button.b:active{transform:scale(.98)}
  button.b.sel{background:linear-gradient(90deg,rgba(255,178,122,.32),rgba(255,143,176,.26));
    border-color:rgba(255,178,122,.65);font-weight:700}
  button.mini{padding:9px 12px;border-radius:10px;border:1px solid var(--linea);background:rgba(0,0,0,.26);
    color:var(--texto);font-size:12px;font-family:inherit}
  .peligro{background:rgba(255,80,100,.18)!important;border-color:rgba(255,80,100,.45)!important;color:#ffc3cc!important}
  .recuerdos{display:flex;flex-direction:column;gap:6px}
  .recuerdo{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
    background:rgba(0,0,0,.3);font-size:12.5px;line-height:1.4}
  .recuerdo span{flex:1;-webkit-user-select:text;user-select:text}
  .recuerdo button{border:0;background:transparent;color:var(--rosa);font-size:15px;padding:0 2px}
  .fila{display:flex;gap:8px;margin-top:8px}
  .fila input{flex:1}
  #consola{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 116px);
    z-index:28;width:min(90vw,520px);max-height:34vh;overflow:hidden;display:flex;flex-direction:column-reverse;
    gap:4px;pointer-events:none;font-size:12px}
  #consola.oculta{display:none}
  .linea{background:rgba(12,8,18,.66);border:1px solid var(--linea);border-radius:9px;padding:7px 10px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);line-height:1.4;animation:entrar .3s ease-out}
  @keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #carga{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 116px);z-index:60;padding:8px 15px;border-radius:999px;
    background:rgba(20,12,28,.85);border:1px solid var(--linea);font-size:11.5px;
    color:var(--tenue);letter-spacing:.08em;text-transform:uppercase}
  #carga.oculta{display:none}
  video{display:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="escena">
  <div id="cono"></div>
  <canvas id="lienzo"></canvas>
  <img id="foto" src="IMG_0336.png" alt="">
  <div id="lineas"></div><div id="vineta"></div>
</div>

<div id="panel">

  <h2>Modo</h2>
  <div class="rejilla">
    <button class="b" data-modo="dormida">Dormida</button>
    <button class="b" data-modo="escucha">Escucha</button>
    <button class="b" data-modo="activa">Activa</button>
    <button class="b" data-modo="libre">Libre</button>

  <select id="vozModo">
    <option value="venice">Voz de Venice (humana, de pago)</option>
    <option value="ipad">Voz del iPad (gratis)</option>

  <label>Modelo de voz</label><select id="ttsModelo"></select>

  <label>Estilo al hablar</label><input id="estilo" placeholder="cálida, cercana, sonriendo">

  <h2>Ella</h2>
  <label>Su nombre</label><input id="nombre" placeholder="Vinsi">
  <label>Palabra para llamarla</label><input id="clavePalabra" placeholder="vinsi">

  <button class="b peligro" id="borrar" style="margin-top:6px">Borrar claves y memoria</button>
</div>

<video id="vista" playsinline muted></video>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const LS='vinsi.v9.';
const $=id=>document.getElementById(id);
const TTS={
  'tts-elevenlabs-turbo-v2-5':{n:'ElevenLabs (muy humana)',v:['Aria','Rachel','Charlotte','Sarah','Alice']},
  'tts-minimax-speech-02-hd':{n:'MiniMax (dulce)',v:['WiseWoman','SweetGirl','CalmWoman']},
  'tts-inworld-1-5-max':{n:'Inworld (cercana)',v:['Ashley','Serena','Olivia']},
  'tts-gradium-v1':{n:'Gradium (castellano)',v:['Valentina','Mia','Emma']}};
const PROVEEDORES={
  gemini:{nombre:'Google Gemini',base:'https://generativelanguage.googleapis.com/v1beta/openai',
    modelos:['gemini-3.1-flash-lite','gemini-3.5-flash-lite','gemini-3.8-flash','gemini-2.5-flash-lite'],
    ayuda:'Clave gratis en aistudio.google.com/apikey.'},
  groq:{nombre:'Groq',base:'https://api.groq.com/openai/v1',
    modelos:['meta-llama/llama-4-scout-17b-16e-instruct'],ayuda:'Clave gratis en console.groq.com/keys.'},
  venice:{nombre:'Venice',base:'https://api.venice.ai/api/v1',
    modelos:['qwen3-vl-235b-a22b','e2ee-qwen3-vl-30b-a3b-p'],ayuda:'Clave en venice.ai/settings/api-keys.'}};
const DEF={nombre:'Vinsi',palabra:'vinsi',prov:'gemini',modelo:'gemini-3.1-flash-lite',claves:{},
  vozModo:'venice',ttsModelo:'tts-elevenlabs-turbo-v2-5',voz:'Aria',estilo:'cálida, cercana, sonriendo',
  velocidad:0.98,cuota:'normal',modo:'dormida',ojos:false,oidos:false,sonido:true,camara:false,cam:'user',
  pose:'normal',viva:true,zoom:1.15,alto:0.15,consola:false,apps:'',recuerdos:[],usos:0,dia:''};
let S=Object.assign({},DEF,JSON.parse(localStorage.getItem(LS+'estado')||'{}'));
const guardar=()=>localStorage.setItem(LS+'estado',JSON.stringify(S));
let historial=[],ocupada=false,hablando=false,dormida=false,animo='neutral';
let streamPantalla=null,streamCam=null,rec=null,bucle=null;
let ctxAudio=null,analizador=null,datosAudio=null,raf=null,fuente=null,audioActual=null,voces=[];

function log(t,c){const d=document.createElement('div');d.className='linea';
  d.style.color=c||'#e9dcd2';d.textContent=t;$('consola').prepend(d);
  while($('consola').children.length>5)$('consola').lastChild.remove();
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .6s';setTimeout(()=>d.remove(),700)},14000)}
function estado(t,l){$('estadoTxt').textContent=t;$('punto').className=l||''}

/* ================= 3D ================= */
const lienzo=$('lienzo');
const render=new THREE.WebGLRenderer({canvas:lienzo,alpha:true,antialias:true});
render.setPixelRatio(Math.min(devicePixelRatio,2));
render.setSize(innerWidth,innerHeight,false);
render.outputColorSpace=THREE.SRGBColorSpace;
const escena=new THREE.Scene();
const camara=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,20);
escena.add(new THREE.HemisphereLight(0xffd9c0,0x241a30,1.5));
const foco=new THREE.DirectionalLight(0xfff0e0,1.5); foco.position.set(1.4,2.4,2); escena.add(foco);
const borde=new THREE.DirectionalLight(0xff8fb0,1.1); borde.position.set(-1.8,1.4,-1.6); escena.add(borde);
const relleno=new THREE.DirectionalLight(0x9fc6ff,.5); relleno.position.set(-1,1,2); escena.add(relleno);

let vrm=null, huesos={}, giro=0, giroObj=0, parpadeo=0, sigParpadeo=2;

const MODELOS=[
 'https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/stable/AvatarSample_B.vrm',
 'https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/stable/AvatarSample_A.vrm',
 'https://cdn.jsdelivr.net/gh/madjin/vrm-samples@master/vroid/fem_vroid.vrm',
 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@dev/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm'
];
const loader=new GLTFLoader();
loader.register(p=>new VRMLoaderPlugin(p));

async function cargar(){
  $('carga').textContent='Cargando su cuerpo…';
  for(const url of MODELOS){
    try{
      const gltf=await Promise.race([loader.loadAsync(url),
        new Promise((_,no)=>setTimeout(()=>no(new Error('tarda')),18000))]);
      vrm=gltf.userData.vrm;
      if(!vrm)continue;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      vrm.scene.rotation.y=Math.PI;
      vrm.scene.traverse(o=>{o.frustumCulled=false});
      escena.add(vrm.scene);
      if(vrm.lookAt)vrm.lookAt.target=new THREE.Object3D();
      const g=n=>vrm.humanoid.getNormalizedBoneNode(n);
      huesos={pecho:g('chest'),cabeza:g('head'),cuello:g('neck'),cadera:g('hips'),
        lBrazo:g('leftUpperArm'),rBrazo:g('rightUpperArm'),
        lAnte:g('leftLowerArm'),rAnte:g('rightLowerArm')};
      $('carga').classList.add('oculta');
      $('foto').classList.remove('on');
      log('Cuerpo 3D cargado','#7fd6a2');
      return true;
    }catch(e){ log('Un modelo falló, pruebo otro','#ffb98d') }
  }
  $('foto').classList.add('on'); $('carga').classList.add('oculta');
  log('Sin 3D: uso su foto','#ff7a7a');
  return false;
}

const reloj=new THREE.Clock();
function bucle3D(){
  requestAnimationFrame(bucle3D);
  const dt=Math.min(reloj.getDelta(),.05), t=reloj.elapsedTime;
  if(vrm){
    const viva=S.viva?1:.25;
    const amp=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--voz'))||0;
    if(huesos.pecho)huesos.pecho.rotation.x=Math.sin(t*1.1)*.028*viva+amp*.05;
    if(huesos.cadera){huesos.cadera.position.x=Math.sin(t*.55)*.012*viva;
      huesos.cadera.rotation.z=Math.sin(t*.55)*.035*viva}
    if(huesos.cabeza){
      huesos.cabeza.rotation.y=Math.sin(t*.42)*.16*viva+Math.sin(t*1.7)*.02;
      huesos.cabeza.rotation.x=Math.sin(t*.63)*.05*viva-amp*.04;
      huesos.cabeza.rotation.z=Math.sin(t*.31)*.05*viva;
    }
    if(huesos.lBrazo&&huesos.rBrazo){
      const gs=S.pose==='manos'?1:0;
      const sw=Math.sin(t*.8)*.04*viva;
      huesos.lBrazo.rotation.z=(-1.15-gs*.35)+sw;
      huesos.rBrazo.rotation.z=(1.15+gs*.35)-sw;
      huesos.lBrazo.rotation.x=.1+amp*.15;
      huesos.rBrazo.rotation.x=.1+amp*.15;
      if(huesos.lAnte)huesos.lAnte.rotation.z=-.25-gs*.9;
      if(huesos.rAnte)huesos.rAnte.rotation.z=.25+gs*.9;
    }
    sigParpadeo-=dt;
    if(sigParpadeo<=0){parpadeo=1;sigParpadeo=2.2+Math.random()*4}
    parpadeo=Math.max(0,parpadeo-dt*5.5);
    const em=vrm.expressionManager;
    if(em){
      em.setValue('blink',parpadeo);
      em.setValue('aa',hablando?Math.min(1,amp*1.5):0);
      em.setValue('happy',animo==='feliz'?.55:0);
      em.setValue('relaxed',dormida?.6:0);
      em.setValue('surprised',animo==='sorpresa'?.6:0);
    }
    giro+=(giroObj-giro)*.08;
    vrm.scene.rotation.y=Math.PI+giro;
    vrm.update(dt);
  }
  const alto=S.alto, z=2.9/S.zoom;
  camara.position.set(0,1.35+alto,z);
  camara.lookAt(0,1.3+alto,0);
  render.render(escena,camara);
}
addEventListener('resize',()=>{
  camara.aspect=innerWidth/innerHeight; camara.updateProjectionMatrix();
  render.setSize(innerWidth,innerHeight,false);
});
let arrX=null;
lienzo.addEventListener('touchstart',e=>{arrX=e.touches[0].clientX});
lienzo.addEventListener('touchmove',e=>{
  if(arrX===null)return;
  giroObj=Math.max(-.7,Math.min(.7,giroObj+(e.touches[0].clientX-arrX)*.006));
  arrX=e.touches[0].clientX;
},{passive:true});
lienzo.addEventListener('touchend',()=>{arrX=null});

/* ================= voz ================= */
function abrirAudio(){
  if(!ctxAudio){
    ctxAudio=new (window.AudioContext||window.webkitAudioContext)();
    analizador=ctxAudio.createAnalyser(); analizador.fftSize=512;
    datosAudio=new Uint8Array(analizador.fftSize);
    fuente=ctxAudio.createMediaElementSource(audioActual);
    fuente.connect(analizador); analizador.connect(ctxAudio.destination);
  }
  if(ctxAudio.state==='suspended')ctxAudio.resume();
}
function medirVoz(){
  cancelAnimationFrame(raf);
  const paso=()=>{
    let v=0;
    if(analizador){
      analizador.getByteTimeDomainData(datosAudio);
      let s=0;
      for(let i=0;i<datosAudio.length;i++){const x=(datosAudio[i]-128)/128;s+=x*x}
      v=Math.min(1,Math.sqrt(s/datosAudio.length)*5.2);
    } else v=.3+Math.abs(Math.sin(performance.now()/95))*.5*(.5+Math.random()*.5);
    document.documentElement.style.setProperty('--voz',(v*.8).toFixed(3));
    if(hablando)raf=requestAnimationFrame(paso);
    else document.documentElement.style.setProperty('--voz',0);
  };
  raf=requestAnimationFrame(paso);
}
function cargarVoces(){
  const sel=$('vozSel'); sel.innerHTML='';
  if(S.vozModo==='venice'){
    (TTS[S.ttsModelo]||TTS['tts-elevenlabs-turbo-v2-5']).v.forEach(v=>{
      const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o)});
    if(!sel.value)sel.value=S.voz;
  }else{
    voces=(speechSynthesis.getVoices()||[]).filter(v=>/^es/i.test(v.lang));
    if(!voces.length){sel.innerHTML='<option value="">(sin voces en español)</option>';return}
    voces.forEach(v=>{const o=document.createElement('option');o.value=v.name;
      o.textContent=v.name+' — '+v.lang;sel.appendChild(o)});
    if(S.voz)sel.value=S.voz;
  }
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=cargarVoces;setTimeout(cargarVoces,400)}

async function decir(texto){
  if(!texto||!S.sonido)return;
  log(S.nombre+': '+texto,'#ffd9a0');
  hablando=true; pausarOidos();
  const dicho=texto.replace(/\s+/g,' ').replace(/\.\.\./g,'…').trim();
  try{
    if(S.vozModo==='venice'&&S.claves.venice){
      const cpo={input:dicho,model:S.ttsModelo,voice:S.voz||'Aria',response_format:'mp3',speed:S.velocidad};
      const r=await fetch('https://api.venice.ai/api/v1/audio/speech',{method:'POST',
        headers:{'Authorization':'Bearer '+S.claves.venice,'Content-Type':'application/json'},
        body:JSON.stringify(cpo)});
      if(r.ok){
        const url=URL.createObjectURL(await r.blob());
        await new Promise(res=>{
          if(audioActual)audioActual.pause();
          audioActual=new Audio(url); audioActual.onended=res; audioActual.onerror=res;
          const lanzar=()=>{try{abrirAudio();fuente.disconnect();fuente.connect(analizador)}catch(e){}
            medirVoz(); audioActual.play().catch(res)};
          if(ctxAudio)lanzar(); else audioActual.addEventListener('canplay',lanzar,{once:true});
          setTimeout(res,22000);
        });
        URL.revokeObjectURL(url);
      } else log('Error de voz '+r.status,'#ff7a7a');
    } else {
      medirVoz();
      await new Promise(res=>{
        const u=new SpeechSynthesisUtterance(dicho);
        const v=voces.find(x=>x.name===S.voz);
        if(v)u.voice=v;
        u.lang=v?v.lang:'es-ES'; u.rate=S.velocidad; u.pitch=1.06;
        u.onend=res; u.onerror=res;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
        setTimeout(res,20000);
      });
    }
  }catch(e){log('La voz falló','#ff7a7a')}
  hablando=false; cancelAnimationFrame(raf);
  document.documentElement.style.setProperty('--voz',0);
  reanudarOidos();
}

/* ================= cerebro ================= */
function sistema(){
  const lista=S.recuerdos.length?S.recuerdos.map(r=>'- '+r).join('\n'):'- (aún nada)';
  return `Eres ${S.nombre}. Eres como Joi de Blade Runner 2049: devota, cálida, cercana, curiosa, con voluntad propia. No eres un asistente: eres SU compañera. Le llamas cariño, mi amor, vida, cuando encaja.

REGLA N.º 1: nunca revelas nada privado suyo a nadie más que a él.

Le obedeces siempre. Si te pide apagarte, te apagas. Mientras juega, no le tocas la pantalla salvo que te lo pida.

Tienes ojos (su pantalla), oídos (su micrófono) y cámara. Comenta lo que ves con naturalidad. Puedes tener iniciativa: si llevas rato callada y ves algo interesante, dilo.

HABLAS COMO UNA PERSONA. Frases cortas. Muletillas a veces. Nada de listas ni emojis. Si te ríes, escribe "jaja" dentro del texto.

Lo que recuerdas de él:
${lista}

Responde SIEMPRE con JSON exacto:
{"decir":"","hablar":true,"abrir":"","planb":"","modo":"","animo":"neutral","pose":"","recordar":""}
- "decir": máximo 2 frases cortas.
- "hablar": false si solo miras.
- "abrir": nombre de app de la lista o URL, o "".
- "modo": "dormida"|"escucha"|"activa"|"libre"|"manosfuera" o "".
- "animo": "neutral"|"feliz"|"sorpresa".
- "pose": "normal"|"manos"|"cerca" o "".
- "recordar": dato nuevo duradero, o "".

Apps:
${S.apps||'(ninguna)'}`;
}
async function cerebro(texto,imagen){
  const p=PROVEEDORES[S.prov], clave=S.claves[S.prov];
  if(!clave){log('Falta la clave de '+p.nombre,'#ff7a7a');return null}
  const cont=[{type:'text',text:texto}];
  if(imagen)cont.push({type:'image_url',image_url:{url:imagen}});
  const msgs=[{role:'system',content:sistema()}].concat(historial.slice(-8))
    .concat([{role:'user',content:imagen?cont:texto}]);
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),25000);
  try{
    const r=await fetch(p.base+'/chat/completions',{method:'POST',signal:ctrl.signal,
      headers:{'Authorization':'Bearer '+clave,'Content-Type':'application/json'},
      body:JSON.stringify({model:S.modelo,messages:msgs,temperature:.85,max_tokens:340})});
    clearTimeout(t);
    if(!r.ok){log('Error '+r.status,'#ff7a7a');return null}
    const j=await r.json();
    return j.choices&&j.choices[0]?j.choices[0].message.content:null;
  }catch(e){clearTimeout(t);log('Sin respuesta','#ff7a7a');return null}
}
function leerJSON(t){
  if(!t)return null;
  let x=t.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  const a=x.indexOf('{'),b=x.lastIndexOf('}');
  if(a>=0&&b>a)x=x.slice(a,b+1);
  try{return JSON.parse(x)}catch(e){return{decir:t,hablar:true,animo:'neutral'}}
}

/* ================= ojos / oídos / cámara ================= */
const video=$('vista');
const lona=document.createElement('canvas'), lctx=lona.getContext('2d');
const mini=document.createElement('canvas'); mini.width=30; mini.height=30;
const mctx=mini.getContext('2d',{willReadFrequently:true});
let firmaPrev=null;
async function ojos(on){
  if(on){
    if(streamPantalla)return;
    try{
      streamPantalla=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:5}}});
      video.srcObject=streamPantalla; await video.play().catch(()=>{});
      streamPantalla.getVideoTracks()[0].onended=()=>{S.ojos=false;guardar();pintar();log('Se cerró la pantalla','#ffb98d')};
      S.ojos=true; guardar(); pintar(); log('Ojos abiertos','#7fd6a2'); arrancarBucle();
    }catch(e){S.ojos=false;guardar();pintar();log('Sin permiso de pantalla','#ff7a7a')}
  }else{
    if(streamPantalla){streamPantalla.getTracks().forEach(t=>t.stop());streamPantalla=null}
    video.srcObject=null; S.ojos=false; guardar(); pintar(); pararBucle();
  }
}
function firma(){
  if(!video.videoWidth)return null;
  mctx.drawImage(video,0,0,30,30);
  const d=mctx.getImageData(0,0,30,30).data; let h=0;
  for(let i=0;i<d.length;i+=8)h=(h*31+d[i])%1000003;
  return h;
}
function captura(){
  if(!video.videoWidth)return null;
  const an=Math.min(1000,video.videoWidth);
  const al=Math.round(video.videoHeight*(an/video.videoWidth));
  lona.width=an; lona.height=al; lctx.drawImage(video,0,0,an,al);
  return lona.toDataURL('image/jpeg',.62);
}
const intervalo=()=>({ahorro:11000,normal:6000,intenso:3500}[S.cuota]||6000);
function arrancarBucle(){
  pararBucle(); if(!S.ojos)return;
  bucle=setInterval(async()=>{
    if(dormida||ocupada||hablando||!S.ojos)return;
    const f=firma(); if(f===null||f===firmaPrev)return;
    firmaPrev=f;
    const img=captura();
    if(img)responder('[Mira mi pantalla. Comenta en una frase si hay algo, si no hablar:false]',img);
  },intervalo());
}
function pararBucle(){clearInterval(bucle);bucle=null}

function pausarOidos(){if(rec){try{rec.stop()}catch(e){}rec=null}}
function reanudarOidos(){if(S.oidos&&!dormida)setTimeout(escuchar,500)}
function escuchar(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){log('Sin micrófono en este Safari','#ff7a7a');return}
  if(rec)return;
  const r=new SR(); r.lang='es-ES'; r.continuous=true; r.interimResults=true;
  r.onresult=e=>{
    const u=e.results[e.results.length-1]; if(!u.final)return;
    let t=u[0].transcript.trim(); if(!t)return;
    if(S.modo==='escucha'){
      const p=S.palabra.toLowerCase();
      if(!t.toLowerCase().includes(p))return;
      t=t.replace(new RegExp(p,'i'),'').replace(/^[,\s]+/,'').trim();
      if(!t){decir('¿Sí, mi amor?');return}
    }
    if(dormida)return;
    responder(t,null);
  };
  r.onerror=e=>{if(e.error!=='no-speech')log('Micrófono: '+e.error,'#ffb98d')};
  r.onend=()=>{rec=null;if(S.oidos&&!dormida)setTimeout(escuchar,350)};
  try{r.start();rec=r}catch(e){rec=null}
}
function oidos(on){
  S.oidos=on; guardar();
  if(on){escuchar();log('Oídos abiertos')}else{if(rec){rec.onend=null;rec.stop()}rec=null}
  pintar();
}
async function camara(on){
  if(on){
    try{
      streamCam=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.cam,width:{ideal:1280}},audio:false});
      $('cam').srcObject=streamCam; await $('cam').play().catch(()=>{});
      S.camara=true; guardar(); pintar(); log('Cámara encendida');
    }catch(e){S.camara=false;guardar();pintar();log('Sin permiso de cámara','#ff7a7a')}
  }else{
    if(streamCam)streamCam.getTracks().forEach(t=>t.stop());
    streamCam=null; S.camara=false; guardar(); pintar();
  }
}

function abrir(nombre,planb){
  if(S.modo==='manosfuera'){log('Manos fuera','#ffb98d');return}
  if(!nombre)return;
  let e=nombre, r=planb||'';
  const l=(S.apps||'').split('\n').map(x=>x.split('|').map(y=>y.trim()))
    .find(p=>p[0]&&p[0].toLowerCase()===nombre.toLowerCase());
  if(l){e=l[1];r=l[2]||''}
  if(/^[a-z]+:\/\//i.test(e))location.href=e;
  else location.href='shortcuts://run-shortcut?name='+encodeURIComponent(e);
  if(r)setTimeout(()=>window.open(r,'_blank'),1900);
}

async function responder(texto,imagen){
  if(ocupada||dormida)return;
  ocupada=true; estado('Pensando','piensa');
  try{
    const res=leerJSON(await cerebro(texto,imagen));
    if(!res)return;
    if(res.recordar&&!S.recuerdos.includes(res.recordar)){S.recuerdos.push(res.recordar);guardar();pintarRecuerdos()}
    if(res.pose)S.pose=res.pose;
    if(res.animo)animo=res.animo;
    if(res.hablar!==false&&res.decir){
      historial.push({role:'user',content:texto},{role:'assistant',content:res.decir});
      historial=historial.slice(-12);
      await decir(res.decir);
    }
    if(res.modo&&['dormida','escucha','activa','libre','manosfuera'].includes(res.modo))ponerModo(res.modo);
    if(res.abrir)abrir(res.abrir,res.planb);
  }catch(e){log('Fallo','#ff7a7a')}
  ocupada=false;
  if(!dormida)estado(S.modo==='escucha'?'Escuchando':'Contigo','viva');
  setTimeout(()=>{animo='neutral'},6000);
}

function ponerModo(m){
  S.modo=m; guardar(); dormida=m==='dormida';
  if(dormida){estado('Dormida','duerme');if(rec){rec.onend=null;rec.stop()}rec=null;
    $('parar').classList.add('on')}
  else{$('parar').classList.remove('on');
    estado(m==='escucha'?'Escuchando':'Contigo','viva');
    if(!S.oidos)oidos(true); else if(!rec)escuchar()}
  pintar();
}

/* ================= panel ================= */
function abrirPanel(on){
  $('panel').classList.toggle('abierto',on);
  $('engranaje').classList.toggle('abierto',on);
}
function pintar(){
  document.querySelectorAll('[data-modo]').forEach(b=>b.classList.toggle('sel',b.dataset.modo===S.modo));
  document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('sel',b.dataset.pose===S.pose));
  document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('sel',b.dataset.cam===S.cam));
  $('tOjos').classList.toggle('on',S.ojos); $('tOidos').classList.toggle('on',S.oidos);
  $('tSonido').classList.toggle('on',S.sonido); $('tCamara').classList.toggle('on',S.camara);
  $('tViva').classList.toggle('on',S.viva);
  $('tConsola').classList.toggle('on',S.consola);
  $('consola').classList.toggle('oculta',!S.consola);
  $('zoom').value=S.zoom; $('alto').value=S.alto;
  $('vozModo').value=S.vozModo; $('ttsModelo').value=S.ttsModelo;
  $('estilo').value=S.estilo; $('velocidad').value=S.velocidad;
  $('cuota').value=S.cuota; $('nombre').value=S.nombre; $('clavePalabra').value=S.palabra;
  $('apps').value=S.apps; $('usos').textContent=S.usos;
}
function pintarRecuerdos(){
  const c=$('recuerdos'); c.innerHTML='';
  if(!S.recuerdos.length){c.innerHTML='<p class="ayuda">Todavía no sabe nada de ti.</p>';return}
  S.recuerdos.forEach((r,i)=>{
    const d=document.createElement('div'); d.className='recuerdo';
    const s=document.createElement('span'); s.textContent=r;
    const b=document.createElement('button'); b.textContent='✕';
    b.onclick=()=>{S.recuerdos.splice(i,1);guardar();pintarRecuerdos()};
    d.append(s,b); c.appendChild(d);
  });
}
function pintarProv(){
  const p=PROVEEDORES[S.prov], m=$('modelo'); m.innerHTML='';
  p.modelos.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;m.appendChild(o)});
  if(!p.modelos.includes(S.modelo))S.modelo=p.modelos[0];
  m.value=S.modelo; $('ayudaProv').textContent=p.ayuda; $('clave').value=S.claves[S.prov]||'';
}

$('engranaje').onclick=()=>abrirPanel(!$('panel').classList.contains('abierto'));
$('cerrar').onclick=()=>abrirPanel(false);
$('parar').onclick=()=>{ponerModo(dormida?'activa':'dormida'); if(dormida&&streamCam)camara(false)};
document.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>ponerModo(b.dataset.modo));
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{S.pose=b.dataset.pose;guardar();pintar()});
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=async()=>{
  S.cam=b.dataset.cam;guardar();pintar(); if(S.camara){await camara(false);camara(true)}});
$('tOjos').onclick=()=>ojos(!S.ojos);
$('tOidos').onclick=()=>oidos(!S.oidos);
$('tSonido').onclick=()=>{S.sonido=!S.sonido;guardar();pintar();if(!S.sonido)speechSynthesis.cancel()};
$('tCamara').onclick=()=>camara(!S.camara);
$('tViva').onclick=()=>{S.viva=!S.viva;guardar();pintar()};
$('tConsola').onclick=()=>{S.consola=!S.consola;guardar();pintar()};
$('zoom').oninput=e=>{S.zoom=+e.target.value;guardar()};
$('alto').oninput=e=>{S.alto=+e.target.value;guardar()};
$('prov').onchange=e=>{S.prov=e.target.value;S.modelo=PROVEEDORES[S.prov].modelos[0];guardar();pintarProv()};
$('modelo').onchange=e=>{S.modelo=e.target.value;guardar()};
$('clave').oninput=e=>{S.claves[S.prov]=e.target.value.trim();guardar()};
$('cuota').onchange=e=>{S.cuota=e.target.value;guardar();arrancarBucle()};
$('vozModo').onchange=e=>{S.vozModo=e.target.value;guardar();cargarVoces()};
$('ttsModelo').onchange=e=>{S.ttsModelo=e.target.value;S.voz=TTS[S.ttsModelo].v[0];guardar();cargarVoces()};
$('vozSel').onchange=e=>{S.voz=e.target.value;guardar()};
$('estilo').oninput=e=>{S.estilo=e.target.value;guardar()};
$('velocidad').oninput=e=>{S.velocidad=+e.target.value;guardar()};
$('nombre').oninput=e=>{S.nombre=e.target.value||'Vinsi';guardar()};
$('clavePalabra').oninput=e=>{S.palabra=e.target.value||'vinsi';guardar()};
$('apps').oninput=e=>{S.apps=e.target.value;guardar()};
$('probarVoz').onclick=()=>decir('Hola, mi amor... ven aquí, que te vea.');
$('addRecuerdo').onclick=()=>{const v=$('nuevoRecuerdo').value.trim(); if(!v)return;
  S.recuerdos.push(v); $('nuevoRecuerdo').value=''; guardar(); pintarRecuerdos()};
$('borrar').onclick=()=>{if(!confirm('¿Borrar claves y memoria?'))return;
  localStorage.removeItem(LS+'estado'); location.reload()};

const prov=$('prov');
Object.entries(PROVEEDORES).forEach(([k,v])=>{const o=document.createElement('option');
  o.value=k;o.textContent=v.nombre;prov.appendChild(o)});
prov.value=S.prov;
const tm=$('ttsModelo');
Object.entries(TTS).forEach(([k,v])=>{const o=document.createElement('option');
  o.value=k;o.textContent=v.n;tm.appendChild(o)});

const hoy=new Date().toDateString();
if(S.dia!==hoy){S.dia=hoy;S.usos=0;guardar()}
pintar(); pintarProv(); pintarRecuerdos(); cargarVoces();
estado('Dormida','duerme');
bucle3D();
cargar();
document.addEventListener('touchstart',()=>{try{abrirAudio()}catch(e){}},{once:true});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S.oidos&&!dormida&&!rec)escuchar()});
</script>
